<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live Panel</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #1e293b;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  h2 { margin-top: 0; color: #ff0050; text-align: center; }
  label { font-size: 14px; color: #94a3b8; display: block; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 16px;
    margin-bottom: 16px;
  }
  .btn-group { display: flex; gap: 10px; margin-bottom: 16px; }
  button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:active { opacity: .7; }
  .btn-connect { background: #ff0050; color: white; }
  .btn-disconnect { background: #334155; color: #94a3b8; }
  .status-card {
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    border: 1px solid #334155;
    margin-bottom: 16px;
  }
  .status-online { color: #10b981; font-weight: bold; }
  .status-offline { color: #ef4444; font-weight: bold; }
  .feed-title { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
  .events-feed {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    height: 300px;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .event-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1e293b;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .event-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #334155;
    object-fit: cover;
    flex-shrink: 0;
  }
  .event-text { flex: 1; word-break: break-word; }
  .type-like   { color: #f43f5e; }
  .type-follow { color: #3b82f6; }
  .type-gift   { color: #eab308; font-weight: bold; }
  .type-erro   { color: #ef4444; }
  .empty {
    color: #64748b;
    text-align: center;
    margin-top: 120px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="card">
  <h2>🎵 TikTok Live Panel</h2>

  <label for="username">Digite o @ da Live:</label>
  <input type="text" id="username" placeholder="ex: eduhh_slk" value="eduhh_slk">

  <div class="btn-group">
    <button class="btn-connect" onclick="conectar()">Conectar</button>
    <button class="btn-disconnect" onclick="desconectar()">Desconectar</button>
  </div>

  <div class="status-card">
    Status: <span id="status-text" class="status-offline">Desconectado</span>
  </div>

  <div class="feed-title">Atividades em tempo real:</div>
  <div class="events-feed" id="events-feed">
    <div class="empty">Aguardando eventos da live...</div>
  </div>
</div>

<script>
let pollTimer = null;
let lastId = 0;

const feed = document.getElementById('events-feed');
const statusEl = document.getElementById('status-text');

function renderEvento(data) {
  // Remove placeholder
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();

  const item = document.createElement('div');
  item.className = 'event-item';

  const avatar = data.avatar || '';
  const avatarTag = avatar
    ? `<img src="${avatar}" class="event-avatar" onerror="this.style.display='none'">`
    : `<div class="event-avatar"></div>`;

  let detalhe = '';
  let icone = '';

  if (data.tipo === 'like') {
    icone = '<span class="type-like">❤️</span>';
    detalhe = 'curtiu a live';
  } else if (data.tipo === 'follow') {
    icone = '<span class="type-follow">👤</span>';
    detalhe = 'começou a seguir';
  } else if (data.tipo === 'gift') {
    icone = '<span class="type-gift">🎁</span>';
    detalhe = `enviou ${data.presente || 'Presente'} (${data.valor || 1} 💎)`;
  } else if (data.tipo === 'connect') {
    icone = '✅';
    detalhe = 'sistema conectado à live';
  } else if (data.tipo === 'erro') {
    icone = '<span class="type-erro">⚠️</span>';
    detalhe = `erro: ${data.mensagem || 'desconhecido'}`;
  } else {
    return;
  }

  item.innerHTML = `
    ${avatarTag}
    <div class="event-text">
      <strong>${data.nome || 'Usuário'}</strong> ${detalhe} ${icone}
    </div>
  `;

  feed.prepend(item);

  // Limita a 50 itens no DOM
  while (feed.children.length > 50) {
    feed.removeChild(feed.lastChild);
  }
}

async function pollEventos() {
  try {
    const res = await fetch('/api/events?since=' + lastId);
    const data = await res.json();
    if (data.eventos && data.eventos.length) {
      // ordem: do mais antigo pro mais novo → prepend inverte
      for (const ev of data.eventos) {
        renderEvento(ev);
      }
      lastId = data.last_id || lastId;
    }
  } catch (e) {
    console.error('Erro no polling:', e);
  }
}

function iniciarPolling() {
  pararPolling();
  pollEventos();
  pollTimer = setInterval(pollEventos, 2000);
}

function pararPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

async function conectar() {
  const user = document.getElementById('username').value.trim();
  if (!user) return alert('Digite o perfil');

  statusEl.className = 'status-offline';
  statusEl.innerText = 'Conectando...';

  feed.innerHTML = '<div class="empty">Conectando à live...</div>';
  lastId = 0;

  try {
    const res = await fetch('/api/connect?username=' + encodeURIComponent(user), {
      method: 'POST'
    });
    const data = await res.json();

    if (data.status === 'success') {
      statusEl.className = 'status-online';
      statusEl.innerText = `Conectado em @${data.username}`;
      iniciarPolling();
    } else {
      statusEl.className = 'status-offline';
      statusEl.innerText = 'Erro: ' + (data.message || 'desconhecido');
    }
  } catch (err) {
    console.error(err);
    statusEl.className = 'status-offline';
    statusEl.innerText = 'Erro de rede/servidor';
  }
}

async function desconectar() {
  pararPolling();
  try {
    await fetch('/api/disconnect', { method: 'POST' });
  } catch (e) {
    console.error(e);
  }
  statusEl.className = 'status-offline';
  statusEl.innerText = 'Desconectado';
  feed.innerHTML = '<div class="empty">Aguardando eventos da live...</div>';
  lastId = 0;
}
</script>
</body>
</html>
