<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: #080c14;
    background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #080c14 70%);
    color: #f1f5f9;
    margin: 0;
    padding: 20px 12px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    padding: 24px;
    border-radius: 20px;
    border: 1px solid rgba(255, 0, 80, 0.3);
    box-shadow: 0 0 35px rgba(255, 0, 80, 0.15), 0 15px 35px rgba(0,0,0,0.6);
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  h2 { 
    margin: 0; 
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff0050 0%, #00f2fe 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 12px;
    color: #64748b;
    margin-top: 4px;
  }
  label { 
    font-size: 13px; 
    font-weight: 600;
    color: #94a3b8; 
    display: block; 
    margin-bottom: 8px; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .input-wrapper {
    position: relative;
    margin-bottom: 16px;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: all .2s;
  }
  input[type="text"]:focus {
    border-color: #ff0050;
    box-shadow: 0 0 12px rgba(255, 0, 80, 0.3);
  }
  .btn-group { display: flex; gap: 12px; margin-bottom: 16px; }
  button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all .2s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); opacity: .8; }
  .btn-connect { 
    background: linear-gradient(135deg, #ff0050 0%, #d90429 100%); 
    color: white; 
    box-shadow: 0 4px 15px rgba(255, 0, 80, 0.4);
  }
  .btn-disconnect { 
    background: #1e293b; 
    color: #94a3b8; 
    border: 1px solid #334155;
  }
  .status-card {
    background: #090d16;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #1e293b;
    margin-bottom: 20px;
  }
  .status-label { color: #64748b; font-weight: 600; }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-online { color: #10b981; }
  .status-online .dot { background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse 1.5s infinite; }
  .status-offline { color: #ef4444; }
  .status-offline .dot { background: #ef4444; }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  .feed-title { 
    font-size: 12px; 
    font-weight: 700;
    color: #64748b; 
    margin-bottom: 10px; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .events-feed {
    background: #090d16;
    border: 1px solid #1e293b;
    border-radius: 14px;
    height: 320px;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .events-feed::-webkit-scrollbar { width: 4px; }
  .events-feed::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  .event-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0f172a;
    border: 1px solid #1e293b;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    animation: slideIn .2s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .event-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #1e293b;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid #334155;
  }
  .event-text { flex: 1; word-break: break-word; color: #cbd5e1; }
  .event-text strong { color: #ffffff; }
  .type-like   { color: #ff0050; font-weight: bold; }
  .type-follow { color: #00f2fe; font-weight: bold; }
  .type-gift   { color: #f59e0b; font-weight: bold; }
  .type-erro   { color: #ef4444; font-weight: bold; }
  .empty {
    color: #475569;
    text-align: center;
    margin-top: 130px;
    font-size: 13px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h2>🎵 TikTok Live Panel</h2>
    <div class="subtitle">Monitoramento de eventos em tempo real</div>
  </div>

  <label for="username">Perfil da Live:</label>
  <div class="input-wrapper">
    <input type="text" id="username" placeholder="ex: eduhh_slk" value="eduhh_slk">
  </div>

  <div class="btn-group">
    <button class="btn-connect" onclick="conectar()">Conectar</button>
    <button class="btn-disconnect" onclick="desconectar()">Sair</button>
  </div>

  <div class="status-card">
    <span class="status-label">Status da Conexão</span>
    <div id="status-badge" class="status-badge status-offline">
      <span class="dot"></span>
      <span id="status-text">Desconectado</span>
    </div>
  </div>

  <div class="feed-title">Atividades no Chat</div>
  <div class="events-feed" id="events-feed">
    <div class="empty">Aguardando início do monitoramento...</div>
  </div>
</div>

<script>
let pollTimer = null;
let lastId = 0;

const feed = document.getElementById('events-feed');
const statusText = document.getElementById('status-text');
const statusBadge = document.getElementById('status-badge');

function renderEvento(data) {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();

  const item = document.createElement('div');
  item.className = 'event-item';

  const avatar = data.avatar || '';
  const avatarTag = avatar
    ? `<img src="${avatar}" class="event-avatar" onerror="this.style.display='none'">`
    : `<div class="event-avatar"></div>`;

  let detalhe = '';
  let icone = '';

  if (data.tipo === 'like') {
    icone = '<span class="type-like">❤️</span>';
    detalhe = 'curtiu a live';
  } else if (data.tipo === 'follow') {
    icone = '<span class="type-follow">👤</span>';
    detalhe = 'começou a seguir';
  } else if (data.tipo === 'gift') {
    icone = '<span class="type-gift">🎁</span>';
    detalhe = `enviou <span class="type-gift">${data.presente || 'Presente'}</span> (${data.valor || 1} 💎)`;
  } else if (data.tipo === 'connect') {
    icone = '✅';
    detalhe = 'conectado com sucesso';
  } else if (data.tipo === 'erro') {
    icone = '<span class="type-erro">⚠️</span>';
    detalhe = `<span class="type-erro">erro: ${data.mensagem || 'desconhecido'}</span>`;
  } else {
    return;
  }

  item.innerHTML = `
    ${avatarTag}
    <div class="event-text">
      <strong>${data.nome || 'Usuário'}</strong> ${detalhe} ${icone}
    </div>
  `;

  feed.prepend(item);

  while (feed.children.length > 50) {
    feed.removeChild(feed.lastChild);
  }
}

async function pollEventos() {
  try {
    const res = await fetch('/api/events?since=' + lastId);
    const data = await res.json();
    if (data.eventos && data.eventos.length) {
      for (const ev of data.eventos) {
        renderEvento(ev);
      }
      lastId = data.last_id || lastId;
    }
  } catch (e) {
    console.error('Erro no polling:', e);
  }
}

function iniciarPolling() {
  pararPolling();
  pollEventos();
  pollTimer = setInterval(pollEventos, 2000);
}

function pararPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

async function conectar() {
  const user = document.getElementById('username').value.trim();
  if (!user) return alert('Digite o perfil');

  statusBadge.className = 'status-badge status-offline';
  statusText.innerText = 'Conectando...';

  feed.innerHTML = '<div class="empty">Conectando à live...</div>';
  lastId = 0;

  try {
    const res = await fetch('/api/connect?username=' + encodeURIComponent(user), {
      method: 'POST'
    });
    const data = await res.json();

    if (data.status === 'success') {
      statusBadge.className = 'status-badge status-online';
      statusText.innerText = `@${data.username}`;
      iniciarPolling();
    } else {
      statusBadge.className = 'status-badge status-offline';
      statusText.innerText = 'Erro na conexão';
    }
  } catch (err) {
    console.error(err);
    statusBadge.className = 'status-badge status-offline';
    statusText.innerText = 'Erro de rede';
  }
}

async function desconectar() {
  pararPolling();
  try {
    await fetch('/api/disconnect', { method: 'POST' });
  } catch (e) {
    console.error(e);
  }
  statusBadge.className = 'status-badge status-offline';
  statusText.innerText = 'Desconectado';
  feed.innerHTML = '<div class="empty">Aguardando início do monitoramento...</div>';
  lastId = 0;
}
</script>
</body>
</html>
